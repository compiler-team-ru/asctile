name: LLVM archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: export
          persist-credentials: false
      # This immutable recipe builds LLVM cd708029 on Ubuntu 22.04.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c42b64cc7905c0259b4c133ae7697a08321d05f7
          path: builder
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: builder
          file: builder/ci/Dockerfile
          load: true
          tags: llvm-export
          build-args: |
            BASE_IMAGE=ubuntu@sha256:98510ac07bb4545e389be502a8918b385c018bfe4ceeb5ac7e0375c782268b04
            BUILD_TARGET=cp311-x86_64
          cache-from: type=gha,scope=builder-cp311-x86_64
          cache-to: type=gha,scope=builder-cp311-x86_64,mode=max
      - name: Verify and archive LLVM
        run: |
          mkdir out
          docker run --rm -v "$PWD/export/ci/export-llvm.py:/export-llvm.py:ro" -v "$PWD/out:/out" \
            -e BUILDER_IMAGE_ID="$(docker image inspect llvm-export --format '{{.Id}}')" \
            -e GITHUB_RUN_ID llvm-export python3 /export-llvm.py
          cd out
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llvm-cd708029-ubuntu22-x86_64
          path: out/*
          compression-level: 0
          retention-days: 90
