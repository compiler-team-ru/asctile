name: LLVM archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            base_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:076b19ef6e698f28649fa817c49d14443201e01da85240e8e52f93e8daa49bff
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:270a5e59af09f02dfc07fe4bb2cb2c5625c76d085cfa47f87dd93d9026eacc75
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: recipe
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build isolated manylinux LLVM image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: recipe
          file: recipe/ci/llvm.Dockerfile
          load: true
          tags: llvm-manylinux-2-28
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          cache-from: type=gha,scope=llvm-manylinux-2-28-${{ matrix.arch }}
          cache-to: type=gha,scope=llvm-manylinux-2-28-${{ matrix.arch }},mode=max
      - name: Verify and archive LLVM
        run: |
          set -euo pipefail
          mkdir out
          docker run --rm \
            -v "$PWD/recipe/ci/export-llvm.py:/export-llvm.py:ro" \
            -v "$PWD/out:/out" \
            -e LLVM_ARCH='${{ matrix.arch }}' \
            -e BASE_IMAGE='${{ matrix.base_image }}' \
            -e BUILDER_IMAGE_ID="$(docker image inspect llvm-manylinux-2-28 --format '{{.Id}}')" \
            -e GITHUB_RUN_ID \
            llvm-manylinux-2-28 python3 /export-llvm.py
          cd out
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llvm-cd708029-manylinux_2_28-${{ matrix.arch }}
          path: out/*
          compression-level: 0
          retention-days: 90
